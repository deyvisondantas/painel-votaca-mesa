<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Painel de Votação</title>

<link rel="stylesheet" href="/painel.css">
</head>

<body>

<div class="screen">

<header>

  <div class="brand-line">

    <img
      src="/logo.png"
      alt="Câmara Municipal"
      class="panel-logo"
    >

    <div>

      <div class="institution">
        CÂMARA MUNICIPAL DE PARNAMIRIM
      </div>

      <div class="small-status">
        PAINEL DE VOTAÇÃO
      </div>

    </div>

  </div>

  <h1 id="titulo">
    VOTAÇÃO
  </h1>

  <h2 id="subtitulo">
    ELEIÇÃO DA MESA DIRETORA
  </h2>

</header>


<main>

  <!-- =====================================================
       RESULTADO FINAL
       ===================================================== -->

  <section
    id="finalResult"
    class="final-result hidden">
  </section>


  <!-- =====================================================
       RESULTADOS DURANTE A VOTAÇÃO
       ===================================================== -->

  <section id="resultsSection">

    <!-- CHAPAS -->

    <section
      id="results"
      class="results">
    </section>


    <!-- ===================================================
         BARRA DE VOTOS
         =================================================== -->

    <section class="progress-card">

      <div class="progress-title">

        <span>
          Votos registrados
        </span>

        <strong id="registered">
          0 / 21
        </strong>

      </div>


      <div
        id="bar"
        class="bar">
      </div>


      <!-- LEGENDA -->

      <div
        id="barLegend"
        class="bar-legend">
      </div>

    </section>

  </section>


  <!-- =====================================================
       COMPOSIÇÃO
       ===================================================== -->

  <section
    id="compositionSection"
    class="composition-wrap">

    <div class="section-title">
      COMPOSIÇÃO DAS CHAPAS
    </div>

    <div
      id="composition"
      class="composition">
    </div>

  </section>


  <!-- =====================================================
       VEREADORES
       ===================================================== -->

  <section class="voters">

    <div class="voters-title">
      VEREADORES
    </div>

    <div
      id="voterList"
      class="voter-list">
    </div>

  </section>

</main>


<footer>

  <span id="footerStatus">
    VOTAÇÃO EM ANDAMENTO
  </span>

  <span id="updated">
    Aguardando lançamento dos votos
  </span>

</footer>

</div>


<script>

let state = null;


const CARGOS = [

  ["presidente","Presidente"],

  ["vice1","1º Vice-Presidente"],

  ["vice2","2º Vice-Presidente"],

  ["secretario1","1º Secretário"],

  ["secretario2","2º Secretário"]

];


const esc = s =>
  String(s ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );


/* =========================================================
   COMPOSIÇÃO DAS CHAPAS
   ========================================================= */

function renderComposition(chapas){

  composition.innerHTML = chapas.map(chapa => `

    <article class="composition-card">

      <h3>
        ${esc(chapa.nome)}
      </h3>

      ${CARGOS.map(
        ([key,label]) => `

          <div class="cargo">

            <span>
              ${label}
            </span>

            <strong>
              ${
                esc(
                  state.vereadores.find(
                    v =>
                      v.gabinete ===
                      chapa.cargos?.[key]
                  )?.nome ||
                  "Não informado"
                )
              }
            </strong>

          </div>

        `
      ).join("")}

    </article>

  `).join("");


  compositionSection.classList.toggle(
    "hidden",
    chapas.length === 0
  );

}


/* =========================================================
   RESULTADO FINAL
   ========================================================= */

function renderFinalResult(ativos, resultado){

  if(!state.finalized){

    finalResult.classList.add("hidden");

    resultsSection.classList.remove("hidden");

    return;
  }


  resultsSection.classList.add("hidden");

  finalResult.classList.remove("hidden");


  if(
    resultado.status === "vencedora" &&
    resultado.vencedora
  ){

    const chapa = resultado.vencedora;

    const votos =
      resultado.contagem[chapa.id] || 0;

    const total =
      resultado.totalVotos || 0;


    finalResult.innerHTML = `

      <div class="winner-kicker">
        🏆 CHAPA ELEITA
      </div>

      <h3>
        ${esc(chapa.nome)}
      </h3>

      <div class="winner-votes">

        ${votos}
        voto${votos === 1 ? "" : "s"}

        <span>
          —
          ${
            total
              ? ((votos / total) * 100).toFixed(2)
              : "0.00"
          }%
        </span>

      </div>


      <div class="winner-composition">

        ${CARGOS.map(
          ([key,label]) => `

            <div class="winner-cargo">

              <span>
                ${label}
              </span>

              <strong>
                ${
                  esc(
                    state.vereadores.find(
                      v =>
                        v.gabinete ===
                        chapa.cargos?.[key]
                    )?.nome ||
                    "Não informado"
                  )
                }
              </strong>

            </div>

          `
        ).join("")}

      </div>

    `;

  }

  else if(resultado.status === "empate"){

    finalResult.innerHTML = `

      <div class="winner-kicker tie">
        ⚠️ EMPATE
      </div>

      <h3>
        Não houve chapa vencedora
      </h3>

      <div class="tie-list">

        ${resultado.empate.map(
          c => `

            <div>

              <strong>
                ${esc(c.nome)}
              </strong>

              <span>
                ${c.votos}
                voto${c.votos === 1 ? "" : "s"}
              </span>

            </div>

          `
        ).join("")}

      </div>

      <p>
        As chapas empatadas tiveram a maior
        quantidade de votos na apuração.
      </p>

    `;

  }

  else{

    finalResult.innerHTML = `

      <div class="winner-kicker tie">
        ⚠️ RESULTADO SEM CHAPA VENCEDORA
      </div>

      <h3>
        Não houve votos destinados às chapas.
      </h3>

      <p>
        A apuração foi encerrada considerando
        os votos registrados.
      </p>

    `;

  }

}


/* =========================================================
   RENDERIZAÇÃO PRINCIPAL
   ========================================================= */

function render(){

  if(!state) return;


  const votos =
    state.votos || {};

  const ausentes =
    state.ausentes || {};


  const total =
    Object.keys(votos).length;


  const presentes =
    state.vereadores.filter(
      v => !ausentes[v.gabinete]
    ).length;


  const ativos =
    state.chapas.filter(
      c => c.ativa
    );


  const resultado =
    state.resultado || {
      status:"aguardando",
      contagem:{},
      totalVotos:total
    };


  titulo.textContent =
    state.titulo;


  subtitulo.textContent =
    state.subtitulo;


  registered.textContent =
    `${total} / ${presentes}`;


  /* =======================================================
     CONTAGEM DAS CHAPAS
     ======================================================= */

  const resultados =
    ativos.map(c => ({

      id:c.id,

      name:c.nome,

      count:
        Object.values(votos)
          .filter(v => v === c.id)
          .length,

      cls:"chapa"

    }));


  /* =======================================================
     CONTAGEM DAS ABSTENÇÕES
     ======================================================= */

  const votosAbstencao =
    Object.values(votos)
      .filter(v => v === "abstencao")
      .length;


  /* =======================================================
     CARDS DAS CHAPAS
     ======================================================= */

  results.style.setProperty(
    "--chapa-count",
    Math.max(1, resultados.length)
  );


  results.innerHTML =
    resultados.map(r => `

      <article class="result chapa">

        <div class="name">
          ${esc(r.name)}
        </div>

        <div class="number">
          ${r.count}
        </div>

        <div class="percent">

          ${
            total
              ? ((r.count / total) * 100).toFixed(1)
              : "0.0"
          }%

        </div>

      </article>

    `).join("");


  /* =======================================================
     BARRA DE VOTOS
     AGORA INCLUI CHAPAS + ABSTENÇÕES
     ======================================================= */

  let barHTML = "";


  resultados.forEach((r, index) => {

  const percentual =
    total
      ? (r.count / total * 100)
      : 0;

  barHTML += `

    <div
      class="seg chapa chapa-seg-${index}"
      style="width:${percentual}%"
      title="${esc(r.name)}: ${r.count} voto${r.count === 1 ? "" : "s"}"
    ></div>

  `;

});


  /* ABSTENÇÕES NA BARRA */

  if(votosAbstencao > 0){

    const percentualAbst =
      total
        ? (votosAbstencao / total * 100)
        : 0;


    barHTML += `

      <div
        class="seg abst"
        style="width:${percentualAbst}%"
        title="Abstenções: ${votosAbstencao} voto${votosAbstencao === 1 ? "" : "s"}"
      ></div>

    `;

  }


  bar.innerHTML = barHTML;


  /* =======================================================
     LEGENDA DA BARRA
     ======================================================= */

  barLegend.innerHTML =
    resultados.map((r,index) => `

      <div class="legend-item">

        <span
          class="legend-dot chapa-dot-${index}">
        </span>

        <span class="legend-name">
          ${esc(r.name)}
        </span>

        <strong>
          ${r.count}
        </strong>

        <span class="legend-votos">
          voto${r.count === 1 ? "" : "s"}
        </span>

      </div>

    `).join("");


  /* ABSTENÇÕES NA LEGENDA */

  barLegend.innerHTML += `

    <div class="legend-item abst-legend">

      <span class="legend-dot abst-dot"></span>

      <span class="legend-name">
        Abstenções
      </span>

      <strong>
        ${votosAbstencao}
      </strong>

      <span class="legend-votos">
        voto${votosAbstencao === 1 ? "" : "s"}
      </span>

    </div>

  `;


  /* =======================================================
     COMPOSIÇÃO
     ======================================================= */

  renderComposition(ativos);


  /* =======================================================
     RESULTADO FINAL
     ======================================================= */

  renderFinalResult(
    ativos,
    resultado
  );


  /* =======================================================
     LISTA DOS VEREADORES
     ======================================================= */

  voterList.innerHTML =
    state.vereadores.map(v => {

      /* AUSENTE */

      if(ausentes[v.gabinete]){

        return `

          <div class="voter absent">

            <span>
              <strong>
                ${esc(v.nome)}
              </strong>
            </span>

            <strong class="va">
              AUSENTE
            </strong>

          </div>

        `;

      }


      const voto =
        votos[v.gabinete];


      /* AGUARDANDO */

      if(!voto){

        return `

          <div class="voter">

            <span>
              <strong>
                ${esc(v.nome)}
              </strong>
            </span>

            <strong class="pending">
              AGUARDANDO
            </strong>

          </div>

        `;

      }


      /* CHAPA */

      const c =
        ativos.find(
          x => x.id === voto
        );


      /* ABSTENÇÃO */

      if(voto === "abstencao"){

        return `

          <div class="voter">

            <span>
              <strong>
                ${esc(v.nome)}
              </strong>
            </span>

            <strong class="abst-vote">
              ABSTENÇÃO
            </strong>

          </div>

        `;

      }


      /* VOTO EM CHAPA */

      const label =
        c ? c.nome : "Abstenção";


      return `

        <div class="voter">

          <span>
            <strong>
              ${esc(v.nome)}
            </strong>
          </span>

          <strong class="${
            c ? "vote" : "va"
          }">

            ${esc(label)}

          </strong>

        </div>

      `;

    }).join("");


  /* =======================================================
     RODAPÉ
     ======================================================= */

  footerStatus.textContent =
    state.finalized

      ? (
          resultado.status === "vencedora"

            ? "VOTAÇÃO ENCERRADA — CHAPA ELEITA"

            : resultado.status === "empate"

              ? "VOTAÇÃO ENCERRADA — EMPATE"

              : "VOTAÇÃO ENCERRADA"
        )

      : "VOTAÇÃO EM ANDAMENTO";


  footerStatus.className =
    state.finalized
      ? "finalized"
      : "";


  updated.textContent =
    state.updatedAt

      ? "Última atualização: " +
        new Date(
          state.updatedAt
        ).toLocaleTimeString("pt-BR")

      : "Aguardando lançamento dos votos";

}


/* =========================================================
   WEBSOCKET
   ========================================================= */

const ws =
  new WebSocket(
    `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`
  );


ws.onmessage = e => {

  const m =
    JSON.parse(e.data);

  if(m.type === "state"){

    state = m.data;

    render();

  }

};


/* =========================================================
   CARREGAMENTO INICIAL
   ========================================================= */

fetch("/api/state")
  .then(r => r.json())
  .then(d => {

    state = d;

    render();

  });

</script>

</body>
</html>
