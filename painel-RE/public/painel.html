<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Painel de Votação</title>
<link rel="stylesheet" href="/painel.css">
</head>
<body>
<div class="screen">
<header>
  <div class="brand-line">
    <img src="/logo.png" alt="Câmara Municipal" class="panel-logo">
    <div>
      <div class="institution">CÂMARA MUNICIPAL DE PARNAMIRIM</div>
      <div class="small-status">PAINEL DE VOTAÇÃO</div>
    </div>
  </div>
  <h1 id="titulo">VOTAÇÃO</h1>
  <h2 id="subtitulo">ELEIÇÃO DA MESA DIRETORA</h2>
</header>

<main>
  <section id="finalResult" class="final-result hidden"></section>

  <section id="resultsSection">
    <section id="results" class="results"></section>

    <section class="progress-card">
      <div class="progress-title"><span>Votos registrados</span><strong id="registered">0 / 21</strong></div>
      <div class="bar" id="bar"></div>
    </section>
  </section>

  <section id="compositionSection" class="composition-wrap">
    <div class="section-title">COMPOSIÇÃO DAS CHAPAS</div>
    <div id="composition" class="composition"></div>
  </section>

  <section class="voters">
    <div class="voters-title">VEREADORES</div>
    <div id="voterList" class="voter-list"></div>
  </section>
</main>

<footer>
  <span id="footerStatus">VOTAÇÃO EM ANDAMENTO</span>
  <span id="updated">Aguardando lançamento dos votos</span>
</footer>
</div>

<script>
let state=null;
const CARGOS=[
 ["presidente","Presidente"],["vice1","1º Vice-Presidente"],["vice2","2º Vice-Presidente"],
 ["secretario1","1º Secretário"],["secretario2","2º Secretário"]
];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function renderComposition(chapas){
  composition.innerHTML=chapas.map(chapa=>`\
    <article class="composition-card">\
      <h3>${esc(chapa.nome)}</h3>\
      ${CARGOS.map(([key,label])=>`<div class="cargo"><span>${label}</span><strong>${esc(state.vereadores.find(v=>v.gabinete===chapa.cargos?.[key])?.nome || "Não informado")}</strong></div>`).join("")}\
    </article>`).join("");
  compositionSection.classList.toggle("hidden", chapas.length===0);
}

function renderFinalResult(ativos, resultado){
  if(!state.finalized){
    finalResult.classList.add("hidden");
    resultsSection.classList.remove("hidden");
    return;
  }

  resultsSection.classList.add("hidden");
  finalResult.classList.remove("hidden");

  if(resultado.status === "vencedora" && resultado.vencedora){
    const chapa=resultado.vencedora;
    const votos=resultado.contagem[chapa.id]||0;
    const total=resultado.totalVotos||0;
    finalResult.innerHTML=`\
      <div class="winner-kicker">🏆 CHAPA ELEITA</div>\
      <h3>${esc(chapa.nome)}</h3>\
      <div class="winner-votes">${votos} voto${votos===1?"":"s"} <span>— ${total?((votos/total)*100).toFixed(2):"0.00"}%</span></div>\
      <div class="winner-composition">\
        ${CARGOS.map(([key,label])=>`<div class="winner-cargo"><span>${label}</span><strong>${esc(state.vereadores.find(v=>v.gabinete===chapa.cargos?.[key])?.nome || "Não informado")}</strong></div>`).join("")}\
      </div>`;
  } else if(resultado.status === "empate") {
    finalResult.innerHTML=`\
      <div class="winner-kicker tie">⚠️ EMPATE</div>\
      <h3>Não houve chapa vencedora</h3>\
      <div class="tie-list">${resultado.empate.map(c=>`<div><strong>${esc(c.nome)}</strong><span>${c.votos} voto${c.votos===1?"":"s"}</span></div>`).join("")}</div>\
      <p>As chapas empatadas tiveram a maior quantidade de votos na apuração.</p>`;
  } else {
    finalResult.innerHTML=`\
      <div class="winner-kicker tie">⚠️ RESULTADO SEM CHAPA VENCEDORA</div>\
      <h3>Não houve votos destinados às chapas.</h3>\
      <p>A apuração foi encerrada considerando os votos registrados.</p>`;
  }
}

function render(){
 if(!state)return;

 const votos=state.votos||{}, ausentes=state.ausentes||{};
 const total=Object.keys(votos).length;
 const presentes=state.vereadores.filter(v=>!ausentes[v.gabinete]).length;
 const ativos=state.chapas.filter(c=>c.ativa);
 const resultado=state.resultado||{status:"aguardando",contagem:{},totalVotos:total};

 titulo.textContent=state.titulo;
 subtitulo.textContent=state.subtitulo;
 registered.textContent=`${total} / ${presentes}`;

 const resultados=[
   ...ativos.map(c=>({
     id:c.id,name:c.nome,
     count:Object.values(votos).filter(v=>v===c.id).length,
     cls:"chapa"
   })),
   {id:"abstencao",name:"Abstenções",
    count:Object.values(votos).filter(v=>v==="abstencao").length,cls:"abst"}
 ];

 results.style.setProperty("--chapa-count", Math.max(1, resultados.length));
 results.innerHTML=resultados.map(r=>`\
   <article class="result ${r.cls}">\
     <div class="name">${esc(r.name)}</div>\
     <div class="number">${r.count}</div>\
     <div class="percent">${total?((r.count/total)*100).toFixed(1):"0.0"}%</div>\
   </article>`).join("");

 bar.innerHTML=resultados.map(r=>
   `<div class="seg ${r.cls}" style="width:${total?(r.count/total*100):0}%"></div>`
 ).join("");

 renderComposition(ativos);
 renderFinalResult(ativos, resultado);

 voterList.innerHTML=state.vereadores.map(v=>{
   if(ausentes[v.gabinete]){
     return `<div class="voter absent"><span><strong>${esc(v.nome)}</strong></span><strong class="va">AUSENTE</strong></div>`;
   }
   const voto=votos[v.gabinete];
   const c=ativos.find(x=>x.id===voto);
   if(!voto) return `<div class="voter"><span><strong>${esc(v.nome)}</strong></span><strong class="pending">AGUARDANDO</strong></div>`;
   const label=c?c.nome:"Abstenção";
   return `<div class="voter"><span><strong>${esc(v.nome)}</strong></span><strong class="${c?"vote":"va"}">${esc(label)}</strong></div>`;
 }).join("");

 footerStatus.textContent=state.finalized?(resultado.status==="vencedora"?"VOTAÇÃO ENCERRADA — CHAPA ELEITA":resultado.status==="empate"?"VOTAÇÃO ENCERRADA — EMPATE":"VOTAÇÃO ENCERRADA"):"VOTAÇÃO EM ANDAMENTO";
 footerStatus.className=state.finalized?"finalized":"";
 updated.textContent=state.updatedAt
   ?"Última atualização: "+new Date(state.updatedAt).toLocaleTimeString("pt-BR")
   :"Aguardando lançamento dos votos";
}

const ws=new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}`);
ws.onmessage=e=>{
 const m=JSON.parse(e.data);
 if(m.type==="state"){state=m.data;render();}
};

fetch("/api/state").then(r=>r.json()).then(d=>{state=d;render();});
</script>
</body>
</html>
